version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: cliniq-db
    environment:
      - POSTGRES_USER=medicorex
      - POSTGRES_PASSWORD=medicorex_dev
      - POSTGRES_DB=medicorex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cliniq-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicorex -d medicorex"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: cliniq-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=medicorex;Username=medicorex;Password=medicorex_dev
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cliniq-network

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: cliniq-web
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - cliniq-network

  redis:
    image: redis:7-alpine
    container_name: cliniq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - cliniq-network

volumes:
  postgres-data:
  redis-data:

networks:
  cliniq-network:
    driver: bridge
